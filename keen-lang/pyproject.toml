[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keen-lang"
version = "0.2.0"
description = "KEEN Programming Language - Write less. Build more."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Monesh K.K." }]
keywords = ["programming-language", "interpreter", "keen"]
dependencies = []

[project.scripts]
keen = "keen.cli.main:main"

[tool.setuptools.packages.find]
include = ["keen*"]
